name: Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - run: python -m pip install --upgrade pip buildozer cython==0.29.36
      - run: buildozer android debug
        working-directory: app_movil/android
      - uses: actions/upload-artifact@v4
        with:
          name: GrupoJE-Android
          path: app_movil/android/bin/*.apk
