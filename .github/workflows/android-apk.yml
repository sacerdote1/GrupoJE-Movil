name: Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: unzip -q GrupoJE_Android_1.0_Fuentes_20261015.zip -d extracted
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
      - run: python -m pip install --upgrade pip buildozer cython==0.29.36
      - name: Build APK
        run: PROJECT_DIR=$(dirname "$(find extracted -name buildozer.spec -print -quit)") && cd "$PROJECT_DIR" && buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: GrupoJE-Android
          path: extracted/**/bin/*.apk
